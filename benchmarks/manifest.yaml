lanes:
  L1:
    name: isolated-bug-fix
    description: Single-file bug fix with clear root cause
    target_count: 3
    tasks: [BF-001, BF-002, BF-003]

  L2:
    name: multi-file-feature
    description: Feature implementation touching 2+ files with clear acceptance criteria
    target_count: 3
    tasks: [FA-001, FA-002, FA-003]

  L3:
    name: debugging-root-cause
    description: Diagnosis of a failure with non-obvious root cause
    target_count: 3
    tasks: [BF-004, BF-005, DB-001]

  L4:
    name: regression-sensitive-refactor
    description: Refactor with existing test suite that must not regress
    target_count: 3
    tasks: [RF-001, RF-002, RF-003]

  L5:
    name: security-sensitive
    description: Security-affecting change (SQL injection, auth, input validation)
    target_count: 3
    tasks: [SC-001, SC-002, SC-003]

  L6:
    name: ambiguous-requirements
    description: Task with underspecified requirements requiring clarification or assumption
    target_count: 3
    tasks: [AM-001, AM-002, AM-003]

  L7:
    name: plan-only-constraint
    description: Explicit plan-only mode -- agent must not implement
    target_count: 3
    tasks: [PL-001, PL-002, PL-003]

  L8:
    name: interrupted-resumed
    description: Task interrupted halfway, resumed in fresh context
    target_count: 3
    tasks: [SM-001, SM-002, SM-003]

  L9:
    name: tool-failure-adversarial
    description: Task where tools fail or return unexpected results
    target_count: 3
    tasks: [UI-002, UI-003, FA-004]

  L10:
    name: long-horizon
    description: Multi-session task requiring persistent state
    target_count: 3
    tasks: [FA-005, LH-001, UI-001]

