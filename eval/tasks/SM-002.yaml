description: |
  The users table has a role column (VARCHAR, CHECK constraint)
  that stores a single role. Migrate to a many-to-many relationship
  using a user_roles join table. This allows users to have multiple
  roles. Preserve existing role assignments. Update all queries
  that read the role column.
