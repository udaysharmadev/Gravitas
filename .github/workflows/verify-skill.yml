name: Verify Skill

on: [push, pull_request, workflow_dispatch]  # dispatch lets the contributor-sync bot trigger CI on its own PRs

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate canonical skill
        run: python .github/scripts/validate_skill.py
