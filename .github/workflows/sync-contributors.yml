name: Sync Contributors

# Keeps the README wall + CONTRIBUTORS.md updated as new contributors land.
# Opens an update PR when repository policy permits GITHUB_TOKEN to do so;
# otherwise retains a patch artifact for maintainers. Bot-created PRs need
# explicit CI dispatch. Auto-merge is used only when enabled by the repository.
# No repository permissions or protection settings are changed by this job.
#
# Runs automatically on every push to main, weekly, or on demand.

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: sync-contributors
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync contributor files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          python scripts/sync_contributors.py --owner "$GITHUB_REPOSITORY_OWNER" --repo "${GITHUB_REPOSITORY#*/}" --token "$GH_TOKEN"
          diff_status=0
          git diff --quiet -- README.md CONTRIBUTORS.md || diff_status=$?
          case "$diff_status" in
            0) printf 'IN_SYNC=1\n' >> "$GITHUB_ENV" ;;
            1) printf 'IN_SYNC=0\n' >> "$GITHUB_ENV" ;;
            *) exit "$diff_status" ;;
          esac

      - name: Check contributor automation capabilities
        if: env.IN_SYNC == '0'
        id: capabilities
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          create_pr=false
          auto_merge=false
          if value=$(gh api "repos/$GITHUB_REPOSITORY/actions/permissions/workflow" --jq '.can_approve_pull_request_reviews' 2>/dev/null); then
            if [ "$value" = "true" ]; then create_pr=true; fi
          fi
          if value=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.allow_auto_merge' 2>/dev/null); then
            if [ "$value" = "true" ]; then auto_merge=true; fi
          fi
          printf 'create_pr=%s\nauto_merge=%s\n' "$create_pr" "$auto_merge" >> "$GITHUB_OUTPUT"
          if [ "$create_pr" != "true" ]; then
            printf 'Contributor changes are available as the contributor-update patch artifact. Bot PR creation is disabled or could not be verified; a maintainer must apply the patch.\n' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$auto_merge" != "true" ]; then
            printf 'Contributor update PRs require manual merge because repository auto-merge is disabled or could not be verified.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare contributor update artifact
        if: env.IN_SYNC == '0'
        run: git diff --binary -- README.md CONTRIBUTORS.md > "$RUNNER_TEMP/contributor-update.patch"

      - name: Retain contributor update artifact
        if: env.IN_SYNC == '0'
        uses: actions/upload-artifact@v4
        with:
          name: contributor-update
          path: ${{ runner.temp }}/contributor-update.patch
          retention-days: 14
          if-no-files-found: error

      - name: Skip if an update PR is already open
        if: env.IN_SYNC == '0' && steps.capabilities.outputs.create_pr == 'true'
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open=$(gh pr list --head chore/sync-contributors --json number --jq length)
          echo "already_open=$open" >> "$GITHUB_OUTPUT"

      - name: Open update PR and trigger its CI
        if: env.IN_SYNC == '0' && steps.capabilities.outputs.create_pr == 'true' && steps.gate.outputs.already_open == '0'
        id: openpr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "gravitas-contrib-bot"
          git config user.email "gravitas-contrib-bot@users.noreply.github.com"
          git checkout -b chore/sync-contributors
          git add README.md CONTRIBUTORS.md
          git commit -m "chore(contributors): sync wall for new contributors" -m "Automated by Sync Contributors workflow."
          git push --force-with-lease origin chore/sync-contributors
          gh pr create --title "chore(contributors): sync wall for new contributors" \
            --body "Automated contributor-wall sync. Existing entries untouched; newcomers appended with PR-number credits. CI is dispatched explicitly onto this branch; auto-merge is requested only when repository policy permits it." \
            --base main --head chore/sync-contributors
          if gh workflow run "GRAVITAS Verify" --ref chore/sync-contributors \
            && gh workflow run "Verify Skill" --ref chore/sync-contributors; then
            echo "dispatched=1" >> "$GITHUB_OUTPUT"
          else
            echo "dispatched=0" >> "$GITHUB_OUTPUT"
            gh pr comment chore/sync-contributors --body "CI dispatch failed. Fallback: push any commit to this branch (even empty) to trigger checks, then merge when green."
            echo "::warning::Verify dispatch failed; left fallback note on the PR."
          fi

      - name: Enable auto-merge on green
        if: env.IN_SYNC == '0' && steps.capabilities.outputs.auto_merge == 'true' && steps.gate.outputs.already_open == '0' && steps.openpr.outputs.dispatched == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --merge chore/sync-contributors
